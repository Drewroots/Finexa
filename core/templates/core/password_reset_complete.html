{% extends "base.html" %}
{% block titulo %}Contraseña actualizada - NovaERP{% endblock %}
{% block contenido_publico %}
<div class="auth-shell">
    <div class="auth-hero">
        <span class="nova-brand-mark mb-4" style="width:46px;height:46px;font-size:1.2rem;">N</span>
        <h1>NovaERP</h1>
    </div>
    <div class="auth-form-side">
        <div class="auth-card">
            <h4 class="mb-1"><i class="bi bi-check-circle-fill text-success"></i> Contraseña actualizada</h4>
            <p class="text-muted small mb-4">Ya puedes iniciar sesión con tu nueva contraseña.</p>
            <a href="{% url 'core:login' %}" class="btn btn-primary w-100">Iniciar sesión</a>
        </div>
    </div>
</div>
{% endblock %}
